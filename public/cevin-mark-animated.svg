<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" class="is-idle">
  <style>
    :root {
      --color-ring: #151A22;
      --color-bullet: #1D4ED8;
      --color-line: #1D4ED8;
    }
    #c {
      stroke: var(--color-ring);
      stroke-width: 8;
      stroke-linecap: round;
      fill: none;
    }
    #bullet {
      fill: var(--color-bullet);
      transform-origin: 24px 32px;
    }
    #line {
      stroke: var(--color-line);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 25 50;
      stroke-dashoffset: 0;
    }

    /* States */
    .is-idle #line {
      stroke-dashoffset: 0;
    }
    .is-idle #bullet {
      transform: scale(1);
    }

    .is-thinking #line {
      stroke-dashoffset: 26;
    }
    .is-thinking #bullet {
      animation: cevin-bullet-breathe 1.2s ease-in-out infinite;
    }

    .is-writing #line {
      animation: cevin-line-write 1.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .is-writing #bullet {
      transform: scale(1);
    }

    .is-done #line {
      animation: cevin-line-done 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .is-done #bullet {
      animation: cevin-bullet-bounce 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .is-error {
      --color-ring: #DC2626;
      --color-bullet: #DC2626;
      --color-line: #DC2626;
    }
    .is-error #line {
      stroke-dashoffset: 26;
    }

    @keyframes cevin-bullet-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    @keyframes cevin-line-write {
      0% { stroke-dashoffset: 26; opacity: 1; }
      58.33% { stroke-dashoffset: 0; opacity: 1; }
      83.33% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    @keyframes cevin-line-done {
      0% { stroke-dashoffset: 26; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes cevin-bullet-bounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .is-thinking #bullet,
      .is-writing #bullet {
        animation: cevin-reduced-pulse 1.2s ease-in-out infinite;
      }
      .is-thinking #line,
      .is-writing #line {
        stroke-dashoffset: 0;
        opacity: 1;
        animation: none;
      }
      .is-done #line {
        stroke-dashoffset: 0;
        animation: none;
      }
      .is-done #bullet {
        transform: scale(1);
        animation: none;
      }
      @keyframes cevin-reduced-pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    }
  </style>
  <path id="c" d="M48.85 46.14A22 22 0 1 1 48.85 17.86"/>
  <circle id="bullet" cx="24" cy="32" r="4"/>
  <line id="line" x1="33" y1="32" x2="58" y2="32"/>
</svg>
